name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-unit-tests:
    name: Build + tests unitarios/web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore KineGestion.sln

      - name: Build
        run: dotnet build KineGestion.sln -c Release --no-restore

      - name: Tests web (controllers/services)
        run: dotnet test KineGestion.Web.Tests/KineGestion.Web.Tests.csproj -c Release --no-build

      - name: Tests unit core (sin BD)
        run: dotnet test KineGestion.Tests/KineGestion.Tests.csproj -c Release --no-build --filter "FullyQualifiedName!~Integration"

  integration-tests:
    name: Tests de integración (SQL Server)
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'KineGestion_CI_2026!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'KineGestion_CI_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      KINEGESTION_TEST_CONNECTION: 'Server=localhost;Database={DatabaseName};User Id=sa;Password=KineGestion_CI_2026!;TrustServerCertificate=True'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore KineGestion.sln

      - name: Build
        run: dotnet build KineGestion.sln -c Release --no-restore

      - name: Tests de integración (SQL Server contenedor)
        run: dotnet test KineGestion.Tests/KineGestion.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~Integration"

  publish-container:
    name: Publicar imagen a GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-unit-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar nombre de imagen (GHCR exige minúsculas)
        id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build y push imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:latest
            ghcr.io/${{ steps.image.outputs.repo }}:${{ github.sha }}